[project]
name = "python-scratch-pad"
version = "0.1.0"
description = "A scratch pad for Python development"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.3.0",
]

[tool.uv]
python-preference = "only-managed"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# F = Pyflakes (catches unused imports)
# E/W = pycodestyle (formatting)
# I = isort (import sorting)
select = ["F", "E", "W", "I"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
